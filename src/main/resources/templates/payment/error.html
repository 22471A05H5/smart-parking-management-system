<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Error - Smart Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/driver/slots">
                <i class="fas fa-car"></i> Smart Parking
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <div class="error-icon mb-4">
                            <i class="fas fa-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                        </div>
                        
                        <h2 class="text-danger mb-3">Payment Error</h2>
                        <p class="lead mb-4">There was an issue processing your payment. Please try again.</p>
                        
                        <div th:if="${error}" class="alert alert-danger">
                            <i class="fas fa-info-circle"></i>
                            <span th:text="${error}"></span>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="fas fa-lightbulb"></i>
                            <strong>Troubleshooting:</strong>
                            <ul class="text-start mt-2 mb-0">
                                <li>Check your internet connection</li>
                                <li>Verify your payment details</li>
                                <li>Try using a different payment method</li>
                                <li>Contact support if the issue persists</li>
                            </ul>
                        </div>
                        
                        <div class="action-buttons">
                            <a href="/driver/bookings" class="btn btn-primary btn-lg me-3">
                                <i class="fas fa-list"></i> View My Bookings
                            </a>
                            <a href="/driver/slots" class="btn btn-outline-primary btn-lg">
                                <i class="fas fa-arrow-left"></i> Back to Slots
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
