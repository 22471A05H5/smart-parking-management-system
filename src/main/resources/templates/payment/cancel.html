<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - Smart Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/driver/slots">
                <i class="fas fa-car"></i> Smart Parking
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <div class="cancel-icon mb-4">
                            <i class="fas fa-times-circle text-warning" style="font-size: 4rem;"></i>
                        </div>
                        
                        <h2 class="text-warning mb-3">Payment Cancelled</h2>
                        <p class="lead mb-4">Your payment was cancelled. Your booking is still pending payment.</p>
                        
                        <div th:if="${booking}" class="booking-summary bg-light p-4 rounded mb-4">
                            <h5 class="text-primary mb-3">Booking Details</h5>
                            <div class="row text-start">
                                <div class="col-sm-6">
                                    <strong>Booking ID:</strong> #<span th:text="${booking.id}"></span><br>
                                    <strong>Slot:</strong> <span th:text="${booking.slot.slotNumber}"></span><br>
                                    <strong>Zone:</strong> <span th:text="${booking.slot.zone}"></span><br>
                                </div>
                                <div class="col-sm-6">
                                    <strong>Vehicle:</strong> <span th:text="${booking.vehicleNumber}"></span><br>
                                    <strong>Amount:</strong> <span th:text="'₹' + ${booking.totalAmount}"></span><br>
                                    <strong>Status:</strong> <span class="badge bg-warning">PENDING PAYMENT</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="alert alert-warning">
                            <i class="fas fa-exclamation-triangle"></i>
                            <strong>Note:</strong> Your slot is reserved but payment is required to confirm the booking.
                        </div>
                        
                        <div class="action-buttons">
                            <a th:href="@{'/payment/checkout/' + ${booking.id}}" class="btn btn-success btn-lg me-3">
                                <i class="fas fa-credit-card"></i> Try Payment Again
                            </a>
                            <a href="/driver/bookings" class="btn btn-outline-primary btn-lg">
                                <i class="fas fa-list"></i> View My Bookings
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
