<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Bookings - Smart Parking Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/dashboard">
                <i class="fas fa-user-shield"></i> Admin Panel
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/dashboard">Dashboard</a>
                <a class="nav-link" href="/admin/drivers">Drivers</a>
                <a class="nav-link" href="/admin/slots">Slots</a>
                <a class="nav-link" href="/admin/bookings">All Bookings</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">
                            <i class="fas fa-user"></i> 
                            Bookings for <span th:text="${user.username}"></span>
                        </h4>
                        <a href="/admin/drivers" class="btn btn-light btn-sm">
                            <i class="fas fa-arrow-left"></i> Back to Drivers
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="row mb-4">
                            <div class="col-md-3">
                                <div class="card bg-info text-white">
                                    <div class="card-body text-center">
                                        <h5 th:text="${#lists.size(bookings)}">0</h5>
                                        <small>Total Bookings</small>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-success text-white">
                                    <div class="card-body text-center">
                                        <h5 th:text="${#lists.size(#lists.select(bookings, booking.status.name() == 'ACTIVE'))}">0</h5>
                                        <small>Active Bookings</small>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-warning text-white">
                                    <div class="card-body text-center">
                                        <h5 th:text="${#lists.size(#lists.select(bookings, booking.paymentStatus.name() == 'PENDING'))}">0</h5>
                                        <small>Pending Payments</small>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-primary text-white">
                                    <div class="card-body text-center">
                                        <h5 th:text="${#aggregates.sum(bookings.![totalAmount])}">₹0</h5>
                                        <small>Total Revenue</small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Booking ID</th>
                                        <th>Slot</th>
                                        <th>Zone</th>
                                        <th>Vehicle</th>
                                        <th>Start Time</th>
                                        <th>End Time</th>
                                        <th>Amount</th>
                                        <th>Booking Status</th>
                                        <th>Payment Status</th>
                                        <th>Created</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="booking : ${bookings}">
                                        <td><strong>#<span th:text="${booking.id}"></span></strong></td>
                                        <td>
                                            <span class="badge bg-secondary" th:text="${booking.slot.slotNumber}"></span>
                                        </td>
                                        <td th:text="${booking.slot.zone}"></td>
                                        <td>
                                            <i class="fas fa-car text-primary"></i>
                                            <span th:text="${booking.vehicleNumber}"></span>
                                        </td>
                                        <td th:text="${#temporals.format(booking.startTime, 'dd-MM-yyyy HH:mm')}"></td>
                                        <td th:text="${#temporals.format(booking.endTime, 'dd-MM-yyyy HH:mm')}"></td>
                                        <td class="text-success">
                                            <strong>₹<span th:text="${booking.totalAmount}"></span></strong>
                                        </td>
                                        <td>
                                            <span th:class="${'badge ' + (booking.status.name() == 'ACTIVE' ? 'bg-success' : 
                                                     (booking.status.name() == 'COMPLETED' ? 'bg-primary' : 'bg-danger'))}"
                                                  th:text="${booking.status}"></span>
                                        </td>
                                        <td>
                                            <span th:class="${'badge ' + (booking.paymentStatus.name() == 'PAID' ? 'bg-success' : 
                                                     (booking.paymentStatus.name() == 'PENDING' ? 'bg-warning' : 'bg-danger'))}"
                                                  th:text="${booking.paymentStatus}"></span>
                                        </td>
                                        <td th:text="${#temporals.format(booking.createdAt, 'dd-MM-yyyy')}"></td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(bookings)}">
                                        <td colspan="10" class="text-center text-muted py-4">
                                            <i class="fas fa-inbox fa-2x mb-2"></i><br>
                                            No bookings found for this user.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
