spring.application.name=park
# Use 8091 by default; override with PORT in production
server.port=${PORT:8091}

# NOTE: Commit-safe defaults. For local development with direct values,
# create src/main/resources/application-local.properties (ignored) and run with --spring.profiles.active=local

# Database Configuration - MySQL (URL is non-sensitive; credentials via env)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/transport_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# Thymeleaf Configuration
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Stripe Configuration (no defaults to avoid leaking secrets)
stripe.api.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
